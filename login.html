{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | VoltCraft Administration</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/admin_portal.css' %}">
</head>
<body class="portal-login-body">

    <div class="login-card">
        <!-- Header -->
        <div class="login-header text-center">
            <div class="portal-brand-badge mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="fw-extrabold text-white mb-1">VoltCraft Admin Portal</h4>
            <p class="text-secondary small mb-0">Store & Appliance Administration Access</p>
        </div>

        <!-- Form Body -->
        <div class="p-4 p-md-5">
            <!-- Flash Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show py-2 small mb-4" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Secure Admin Login Form (Username & Password Only) -->
            <form method="POST" action="{% url 'admin_portal:login' %}">
                {% csrf_token %}
                
                <!-- Username Input -->
                <div class="mb-3">
                    <label for="username" class="form-label small fw-bold">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                        <input 
                            type="text" 
                            name="username" 
                            id="username" 
                            class="form-control" 
                            required 
                            autocomplete="username"
                            placeholder="Enter admin username">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                    <label for="password" class="form-label small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key-fill"></i></span>
                        <input 
                            type="password" 
                            name="password" 
                            id="password" 
                            class="form-control" 
                            required 
                            autocomplete="current-password"
                            placeholder="Enter admin password">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3 shadow-sm mb-3">
                    Sign In to Portal &raquo;
                </button>
            </form>

            <!-- Storefront Redirect Link -->
            <div class="text-center border-top pt-3 small text-muted">
                <a href="{% url 'store:home' %}" class="text-secondary text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Return to Public Storefront
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
