{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password | HomeHub{% endblock %}

{% block content %}
<div class="container py-5 my-md-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            
            <!-- Card -->
            <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5">
                
                <!-- Header / Icon -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-key fs-2 text-primary"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Reset Password</h3>
                    <p class="text-muted small">Enter the 6-digit OTP sent to your email.</p>
                </div>

                <!-- Django Messages Alert -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show py-2 small" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- Form -->
                <form method="POST">
                    {% csrf_token %}

                    <!-- OTP Input -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">6-Digit OTP</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-shield-check"></i>
                            </span>
                            <input type="text" name="otp" maxlength="6" class="form-control bg-light border-start-0 text-center fw-bold fs-5 tracking-wide" placeholder="------" required autofocus>
                        </div>
                    </div>

                    <!-- New Password -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" name="new_password" id="newPass" class="form-control bg-light border-start-0 border-end-0 ps-0" placeholder="Minimum 8 characters" required>
                            <button class="btn btn-light border border-start-0 text-muted" type="button" onclick="togglePass('newPass', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" name="confirm_password" id="confirmPass" class="form-control bg-light border-start-0 border-end-0 ps-0" placeholder="Re-enter password" required>
                            <button class="btn btn-light border border-start-0 text-muted" type="button" onclick="togglePass('confirmPass', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold text-white shadow-sm">
                        <i class="bi bi-check-circle me-2"></i>Update Password
                    </button>
                </form>

            </div>

        </div>
    </div>
</div>

<!-- Password Toggle Script -->
<script>
function togglePass(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}
</script>
{% endblock %}
