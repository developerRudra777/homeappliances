    <rect x="21" y="19" width="4.5" height="4.5" rx="1" fill="#ea580c"/>
    <rect x="15" y="25" width="4.5" height="4.5" rx="1" fill="#ea580c"/>
    <rect x="21" y="25" width="4.5" height="4.5" rx="1" fill="#ea580c"/>
