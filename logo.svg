  <text x="56" y="30" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#111111" letter-spacing="-0.5">Home<tspan fill="#ea580c">Hub</tspan></text>
  <text x="57" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#78716c" letter-spacing="0.5">LIVE BETTER. LIVE SMART.</text>
